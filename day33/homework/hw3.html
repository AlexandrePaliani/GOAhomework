<!-- 3) შექმენი კვადრატი (div-ით) რომელიც იქნება 100x100 px, მაუსის გადატარებისას გახდეს 300x300 -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <div onmouseover="this.style.width='300px'; this.style.height='300px'" onmouseout="this.style.width='100px'; this.style.height='100px'" style="width: 100px; height: 100px; background-color: lightblue;"></div>
 </body>
 </html>

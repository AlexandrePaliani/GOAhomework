<!-- 1) ახსენით რა არის inline და block level ელემენტები -->
<!-- 1. Inline ელემენტები არის HTML ელემენტები, რომლებიც არ იწვევენ ხაზის გადატანას და განლაგებულია ერთ ხაზზე სხვა ელემენტებთან ერთად. მაგალითად: <span>, <a>, <strong>. Block level ელემენტები არის HTML ელემენტები, რომლებიც იწვევენ ხაზის გადატანას და იწყება ახალ ხაზზე. მაგალითად: <div>, <p>, <h1>. -->

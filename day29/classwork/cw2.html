<!-- 2) შექმენით პარაგრაფო და გასტილეთ სამივე სელექტორით სხვადასხვა ფერებში. ახსენით რომელი სელექტორის სტილი მიენიჭა და რატომ -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p class="my-class" id="my-id">This is a paragraph.</p>
    <style>
        p {
            color: red; /* tag selector */
        }
        .my-class {
            color: blue; /* class selector */
        }
        #my-id {
            color: green; /* id selector */
        }
    </style>
</body>
</html>

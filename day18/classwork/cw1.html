<!-- 1) კომენტარის სახით ახსენით რაში ვიყენებთ header,main,footer,section,aside,article
 -->
<!-- header - ვებსაიტის ან დოკუმენტის თავში განთავსებული ინფორმაცია, როგორიცაა ლოგო, ნავიგაცია და სათაური.
main - ვებსაიტის ან დოკუმენტის მთავარი კონტენტი, რომელიც წარმოადგენს ძირითად ინფორმაციას.
footer - ვებსაიტის ან დოკუმენტის ქვედა ნაწილი, სადაც ხშირად განთავსებულია საკონტაქტო ინფორმაცია, ავტორის უფლებები და სხვა დამატებითი ბმულები.
section - ვებსაიტის ან დოკუმენტის ნაწილი, რომელიც გამოიყენება კონტენტის ლოგიკური დაყოფისთვის.
aside - გვერდითი ინფორმაცია, რომელიც არ არის მთავარი კონტენტი, მაგრამ შეიძლება იყოს დაკავშირებული მასთან, როგორიცაა რეკლამები ან დამატებითი ბმულები.
article - დამოუკიდებელი კონტენტის ნაწილი, რომელიც შეიძლება გამოქვეყნდეს და გავრცელდეს დამოუკიდებლად, როგორიცაა ბლოგ პოსტი ან ახალი ამბები.
-->

<!-- 2) შექმენით სარეგისტაციო ფორმა ბანკისთვის, ფორმაში იყოს: სახელი, გვარი, მეილი, თანხის რაოდენობა,სქესის არჩევა (radio buttons) და drop down menu სადაც მოცემული იქნება რომელი ფულის ერთეულის გამოტანა სურს (ლარი, დოლარი, ევრო და ა.შ.) საწყის არჩევანად იყოს select currency და ის უნდა იყოს გაუქმებული, აუცილებლად გამოიყენეთ სწორი id, label, name, value, type
 -->
<form action="#" method="post">
  <label for="firstName">სახელი:</label>
  <input type="text" id="firstName" name="firstName" required><br><br>

  <label for="lastName">გვარი:</label>
  <input type="text" id="lastName" name="lastName" required><br><br>

  <label for="email">მეილი:</label>
  <input type="email" id="email" name="email" required><br><br>

  <label for="amount">თანხის რაოდენობა:</label>
  <input type="number" id="amount" name="amount" required><br><br>

  <label>სქესი:</label>
  <input type="radio" id="male" name="gender" value="male" required>
  <label for="male">male</label>
  <input type="radio" id="female" name="gender" value="female" required>
  <label for="female">female</label><br><br>
    <label for="currency">ფულის ერთეული:</label>
    <select id="currency" name="currency" required>
      <option value="" disabled selected>Select currency</option>
      <option value="gel">ლარი (₾)</option>
      <option value="usd">დოლარი ($)</option>
      <option value="eur">ევრო (€)</option>
      <option value="yen">იენი (¥)</option>
      <option value="rub" disabled>რუბლი (₽) [DISABLED]</option>
    </select><br><br>   
    <button type="submit">რეგისტრაცია</button>
</form>

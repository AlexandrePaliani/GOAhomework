<!-- 2)კომენტარის სახით ახსენით internal და external css კოდის ანატომია (css rule / declaration...) -->
    <!--
        Internal CSS კოდის ანატომია:
        - CSS Rule: ეს არის სტილის წესი, რომელიც შედგება სელექტორისგან და დეკლარაციისგან. მაგალითად:
          p {
             color: red;
          }
          აქ "p" არის სელექტორი, რომელიც მიუთითებს რომ ეს წესი ეხება ყველა <p> ელემენტს.
        
        - Declaration: ეს არის სელექტორის მიერ განსაზღვრული სტილის თვისებები და მათი მნიშვნელობები. მაგალითად:
          color: red;
          აქ "color" არის თვისება და "red" არის მისი მნიშვნელობა.

        External CSS კოდის ანატომია:
        - External CSS-ში, CSS კოდი დაწერილია ცალკე .css ფაილში და შეიცავს CSS წესებს, რომლებიც შემდეგ ჩართულია HTML დოკუმენტში <link> ტეგის საშუალებით. მაგალითად:
          styles.css ფაილი:
          p {
             color: blue;
          }
          HTML დოკუმენტი:
          <link rel="stylesheet" href="styles.css">
     -->

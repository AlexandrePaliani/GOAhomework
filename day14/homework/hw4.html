<!-- 4) შექმენით ფორმა სადაც იქნება: სახელი, გვარი, პაროლი, მეილი და გაგზავნის ღილაკი, ინფორმაცია კი არ გაიგზავნოს იქამდე სანამ მომხმარებელი ყველა input არ შეავსებს (ამ დავალებისთვის შეისწავლეთ input-ის ახალი ატრიბუტი სახელად required)
 -->
<form action="#" method="post">
  <label for="firstName">სახელი:</label>
  <input type="text" id="firstName" name="firstName" required><br><br>

  <label for="lastName">გვარი:</label>
  <input type="text" id="lastName" name="lastName" required><br><br>

  <label for="password">პაროლი:</label>
  <input type="password" id="password" name="password" required><br><br>

  <label for="email">მეილი:</label>
  <input type="email" id="email" name="email" required><br><br>

  <button type="submit">გაგზავნა</button>
</form>

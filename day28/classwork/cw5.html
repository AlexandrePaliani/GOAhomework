<!-- 5)HTML ფაილში: დაამატე სათაური (h1) დაამატე ორი პარაგრაფი (p) / გამოიყენე Internal CSS (style თეგის გამოყენებით head-ში) და შეცვალე:
• პარაგრაფის ტექსტის ფერი (color)
• პარაგრაფის ფონური ფერი (background-color)
• heading-ის ტექსტის განლაგება (text-align) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            text-align: center;
        }
        p {
            color: blue;
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <h1>My Website</h1>
    <p>This is the first paragraph.</p>
    <p>This is the second paragraph.</p>
</body>
</html>

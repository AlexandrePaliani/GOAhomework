    <!--
        CSS-ის გამოყენების ტექნიკები:
        1) Inline CSS - სტილის პირდაპირი დაწერა HTML ელემენტში. მაგალითად: <p style="color: red;">This is a red paragraph.</p>
        2) Internal CSS - სტილის დაწერა HTML დოკუმენტის <head> ნაწილში <style> ტეგის შიგნით. მაგალითად:
           <style>
              p {
                 color: blue;
              }
           </style>
        3) External CSS - სტილის დაწერა ცალკე .css ფაილში და მისი ჩართვა HTML დოკუმენტში <link> ტეგის საშუალებით. მაგალითად:
           <link rel="stylesheet" href="styles.css">
        
        სხვაობა:
        - Inline CSS გამოიყენება მხოლოდ კონკრეტულ ელემენტზე და აქვს მაღალი პრიორიტეტი, მაგრამ არ არის რეკომენდებული, რადგან არღვევს HTML და CSS-ის განცალკევებას.
        - Internal CSS გამოიყენება მხოლოდ კონკრეტულ HTML დოკუმენტზე და არ არის რეკომენდებული დიდი პროექტებისთვის, რადგან არღვევს კოდის ორგანიზაციას.
        - External CSS არის საუკეთესო პრაქტიკა, რადგან ის საშუალებას აძლევს სტილს მრავალ HTML დოკუმენტზე გამოყენებას და ხელს უწყობს კოდის ორგანიზაციას და შენარჩუნებას.
     -->
